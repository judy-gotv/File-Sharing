<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件分享</title>
<link rel="stylesheet" href="/common.css">
<style>
#q{width:100%;padding:12px 14px;border-radius:12px;font-size:14px}
.chips{margin:12px 0 16px;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);color:var(--opt-fg);border:1px solid var(--border);border-radius:16px;padding:4px 12px;font-size:13px;cursor:pointer;backdrop-filter:var(--blur)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.u{display:flex;gap:8px}
.u input{flex:1;min-width:0;padding:6px 8px;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
@media(max-width:700px){
  /* 移动端:列表转卡片,所有字段可见,无需横滑 */
  #list-table thead{display:none}
  #list-table tbody tr{display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;padding:10px 12px}
  #list-table td{display:block;border:0;padding:2px 0}
  #list-table td.c-req,#list-table td.c-name{display:inline-block;vertical-align:middle;padding:0}
  #list-table td.c-name{font-size:15px;font-weight:600;margin-left:8px;word-break:break-all}
  #list-table td.c-addr{margin:8px 0 4px}
  #list-table td.c-addr .u button{flex-shrink:0}
  #list-table td.c-desc{color:var(--muted);font-size:12px;word-break:break-all}
  #list-table td.c-dl,#list-table td.c-cp{display:inline-block;font-size:12px;color:var(--muted);margin-right:14px}
  #list-table td.c-dl::before,#list-table td.c-cp::before{content:attr(data-label);margin-right:4px}
  #list-table tbody tr:hover td{background:transparent}
}
#list-table.no-dl .c-dl{display:none}
.page-foot{text-align:center;color:var(--muted);font-size:13px;margin:26px 0 10px;line-height:1.8;word-break:break-word}
.page-foot a{color:#3b82f6}
/* 弹窗公告:尺寸随内容自适应 */
.modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-bd[hidden]{display:none}
.modal-card{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:18px;width:min(92vw,600px);max-height:84vh;overflow:auto;padding:26px 26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal-x{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--row);color:var(--muted);font-size:18px;line-height:1}
.modal-head{display:flex;align-items:center;justify-content:center;gap:8px;font-size:19px;font-weight:700;margin-bottom:8px}
.modal-head .ico{width:22px;height:22px}
.md-body{line-height:1.7;word-break:break-word}
.md-body h1,.md-body h2,.md-body h3{margin:.6em 0 .4em}
.md-body p{margin:.5em 0}
.md-body ul,.md-body ol{padding-left:1.4em;margin:.5em 0}
.md-body a{color:#3b82f6}
.md-body img{max-width:100%;border-radius:8px}
.md-body pre{background:var(--row);padding:10px 12px;border-radius:8px;overflow:auto}
.md-body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.md-body table{width:100%;border-collapse:collapse;margin:.6em 0}
.md-body th,.md-body td{border:1px solid var(--border);padding:6px 10px}
#ad-ok{display:block;margin:18px auto 0;background:var(--grad);color:#fff;border:0;border-radius:999px;padding:10px 46px;font-size:15px;cursor:pointer}
</style>
</head>
<body data-title="site_title">
<div class="shell no-side">
  <div class="main">
    <header class="topbar">
      <div class="crumb"><span class="logo sm" data-icon="folder"></span><span data-i18n="site_title"></span></div>
      <div class="topright">
        <a class="btn gray" href="/admin"><span data-icon="shield"></span><span data-i18n="admin_link"></span></a>
        <div class="tools" id="tools"></div>
      </div>
    </header>
    <div class="content narrow">
      <div class="page-head">
        <h2 data-i18n="pg_home_t"></h2>
        <p data-i18n="pg_home_d"></p>
      </div>
      <input id="q" type="text" data-i18n-ph="search_ph">
      <div class="chips" id="chips"></div>
      <div class="card flush xscroll">
        <table id="list-table">
          <thead><tr>
            <th data-i18n="th_req"></th><th data-i18n="th_name"></th><th data-i18n="th_addr"></th>
            <th data-i18n="th_desc"></th><th data-i18n="th_dl" class="c-dl"></th><th data-i18n="th_copies"></th>
          </tr></thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="gray" id="prev" data-i18n="prev"></button><span id="pinfo"></span><button class="gray" id="next" data-i18n="next"></button>
      </div>
      <footer id="site-footer" class="page-foot" hidden></footer>
    </div>
  </div>
</div>
<div id="ad-modal" class="modal-bd" hidden>
  <div class="modal-card">
    <button class="modal-x" id="ad-x" aria-label="close">×</button>
    <div class="modal-head"><span data-icon="mega"></span><span data-i18n="ad_title"></span></div>
    <div id="ad-body" class="md-body"></div>
    <button id="ad-ok" data-i18n="ad_ok"></button>
  </div>
</div>
<script src="/common.js?v=20261008"></script>
<script>
const st={q:'',cat:null,page:1,size:20,pages:1,nameDownload:true};

async function loadSettings(){
  try{
    const s=await (await fetch('/api/settings')).json();
    st.nameDownload=s.name_download!==false;
    if(s.footer_html){
      $('#site-footer').innerHTML=s.footer_html;
      $('#site-footer').hidden=false;
    }
  }catch{st.nameDownload=true;}
}

async function loadAds(){
  try{
    const ads=await (await fetch('/api/ads')).json();
    if(!ads.length)return;
    $('#ad-body').innerHTML=ads[0].html;
    $('#ad-modal').hidden=false;
  }catch{}
}
$('#ad-x').onclick=()=>{$('#ad-modal').hidden=true;};
$('#ad-ok').onclick=()=>{$('#ad-modal').hidden=true;};

async function loadCats(){
  const cs=await (await fetch('/api/categories')).json();
  $('#chips').innerHTML=cs.length?
    `<span class="chip ${st.cat==null?'on':''}" data-c="">${t('all')}</span>`+
    cs.map(c=>`<span class="chip ${st.cat===c.id?'on':''}" data-c="${c.id}">${esc(c.name)} (${c.count})</span>`).join(''):'';
}

async function load(){
  const p=new URLSearchParams({page:st.page,size:st.size});
  if(st.q)p.set('q',st.q);
  if(st.cat!=null)p.set('category',st.cat);
  const d=await (await fetch('/api/items?'+p)).json();
  st.pages=Math.max(1,Math.ceil(d.total/d.size));
  if(st.page>st.pages){st.page=st.pages;return load();}
  $('#tb').innerHTML=d.items.length?d.items.map(i=>{
    const nm=st.nameDownload
      ?`<a href="/go/${i.id}" target="_blank" rel="noopener">${esc(i.name)}</a>`
      :esc(i.name);
    const pin=i.pinned
      ?`<span class="tag pin" style="border-color:${esc(i.pin_color)};color:${esc(i.pin_color)}">${t('pinned')}</span>`:'';
    return `<tr>
    <td class="c-req">${pin}</td>
    <td class="c-name">${nm}${i.alive===false?` <span class="tag req">${t('dead')}</span>`:''}</td>
    <td class="c-addr"><div class="u"><input type="text" readonly value="${esc(i.url)}"><button data-u="${esc(i.url)}" data-id="${i.id}">${t('copy')}</button></div></td>
    <td class="c-desc">${esc(i.description)}</td>
    <td class="c-dl" data-label="${t('th_dl')}">${i.downloads}</td><td class="c-cp" data-label="${t('th_copies')}">${i.copies}</td></tr>`;
  }).join('')
    :`<tr><td colspan="${st.nameDownload?6:5}" class="empty">${t('none_found')}</td></tr>`;
  $('#tb').closest('table').classList.toggle('no-dl',!st.nameDownload);
  $('#pinfo').textContent=t('page_info',st.page,st.pages,d.total);
  $('#prev').disabled=st.page<=1;
  $('#next').disabled=st.page>=st.pages;
}

$('#tb').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-u]');if(!b)return;
  const u=b.dataset.u;
  try{await navigator.clipboard.writeText(u)}catch{
    const x=document.createElement('textarea');x.value=u;document.body.append(x);x.select();
    document.execCommand('copy');x.remove();
  }
  fetch('/api/items/'+b.dataset.id+'/copy',{method:'POST',keepalive:true}).catch(()=>{});
  b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),1200);
});
$('#chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  st.cat=c.dataset.c===''?null:Number(c.dataset.c);st.page=1;loadCats();load();
});
$('#prev').onclick=()=>{if(st.page>1){st.page--;load();}};
$('#next').onclick=()=>{if(st.page<st.pages){st.page++;load();}};
let timer;
$('#q').addEventListener('input',e=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{st.q=e.target.value.trim();st.page=1;load();},250);
});
window.onLangChange=()=>{loadCats();load();};
loadSettings().then(()=>{loadCats();load();loadAds();});
</script>
</body>
</html>
